name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Lint Code (flake8)
        run: |
          pip install flake8
          flake8 app --count --max-line-length=100 --statistics

      - name: Dependency Security Scan
        run: |
          pip install pip-audit
          pip-audit

      - name: Run Tests (pytest)
        run: |
          pip install pytest
          if [ -d "tests" ]; then pytest -q; else echo "No tests found - skipping"; fi

      - name: Build Docker Image
        run: |
          docker build \
            -t devops-phase0:latest \
            -t devops-phase0:${{ github.sha }} \
            ./app

      - name: Verify Docker Image
        run: |
          docker images | grep devops-phase0

      - name: Test Docker Container
        run: |
          docker run -d -p 5000:5000 --name test-app devops-phase0:latest
          sleep 5
          curl -f http://localhost:5000/health || (docker logs test-app && exit 1)
          docker stop test-app
          docker rm test-app

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Connect GitHub Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Load SSH deployment key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH host verification
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "[$SERVER_HOST]:22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICS/HDbCSGemuEuXQbLWYF1cBLhu+NAp09cOGyhBp6hw" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Tailscale SSH connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          nc -zv "$SERVER_HOST" 22

      - name: Deploy to Ubuntu VM
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            'sudo -n /usr/local/bin/deploy-devops-lab'
